org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Pin Gradle's JDK to Android Studio's bundled JBR (21) instead of whatever
# Java is first on PATH — an ambient JDK 26 was causing inconsistent
# auto-detected JVM targets between javac and kotlinc in third-party plugin
# modules (e.g. "Java 17 vs Kotlin 21" in :photo_manager:compileDebugKotlin).
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
android.useAndroidX=true
android.enableJetifier=true
# Kotlin's incremental compiler relativizes each source file's path against the build
# root to key its caches. Every plugin's source (photo_manager included) lives under the
# pub cache on C:, while this project is on D: — relativizing across drive letters throws
# on Windows ("this and base files have different roots"). Kotlin swallows that around most
# individual cache writes and falls back to a slower non-incremental compile, but a cache
# left mid-write by an earlier interrupted build hits it hard enough to fail the compile
# task outright (":photo_manager:compileReleaseKotlin" and its debug equivalent). Turning
# incremental compilation off removes the relativization step rather than dodging it build
# by build.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
