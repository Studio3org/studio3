org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Pin Gradle's JDK to Android Studio's bundled JBR (21) instead of whatever
# Java is first on PATH — an ambient JDK 26 was causing inconsistent
# auto-detected JVM targets between javac and kotlinc in third-party plugin
# modules (e.g. "Java 17 vs Kotlin 21" in :photo_manager:compileDebugKotlin).
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Play Console's pre-launch report flags "Optimized resource shrinking isn't
# enabled" on older AGP — as of AGP 8.11 this is unconditional default
# behavior (the opt-in flag that used to control it was removed), so nothing
# needs setting here on this AGP version.
